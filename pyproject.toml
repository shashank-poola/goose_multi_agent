[project]
name = "goose-agents"
version = "0.1.0"
description = "Multi-tier AI research agent with contradiction detection and gap analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM via OpenRouter (OpenAI-compatible)
    "openai>=1.54.0",
    # Search
    "exa-py>=1.1.0",
    # Vector store
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Cache / queue
    "redis>=5.2.0",
    # Config
    "pydantic-settings>=2.6.0",
    # Utils
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
